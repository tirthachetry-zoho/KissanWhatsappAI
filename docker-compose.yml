# =============================================================================
#  Kissan-AI — docker-compose (app only; connects to a managed Postgres e.g. Neon)
#
#  Usage:
#     cp .env.example .env      # edit the secrets (DB_URL/DB_USER/DB_PASSWORD)
#     docker compose up -d --build
#     curl http://localhost:8080/health
#     docker compose logs -f app
# =============================================================================
services:
  openwa:
    image: openwa/wa-automate:latest
    container_name: kissan-ai-openwa
    restart: unless-stopped
    ports:
      - "${OPENWA_PORT:-2785}:3000"
    environment:
      PORT: 3000
      WHATSAPP_HOOK_URL: "${OPENWA_WEBHOOK_URL:-http://app:8080/openwa/webhook}"
      WHATSAPP_HOOK_SECRET: "${OPENWA_WEBHOOK_SECRET:-}"
      WHATSAPP_API_KEY: "${OPENWA_API_KEY:-}"
      SESSION_NAME: "${OPENWA_SESSION_NAME:-kissan-assistant}"
      WHATSAPP_AUTO_REGISTER_WEBHOOK: "${OPENWA_AUTO_REGISTER_WEBHOOK:-false}"
    volumes:
      - openwa_session:/app/.sessions
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  app:
    build: .
    container_name: kissan-ai-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:                   # real secrets live in .env, which is gitignored
      - .env
    environment:
      JAVA_OPTS: "${JAVA_OPTS:-}"
      JAVA_OPTS_EXTRA: "${JAVA_OPTS_EXTRA:-}"
      OPENWA_API_BASE_URL: "http://openwa:3000"
    depends_on:
      openwa:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  openwa_session:
