# =============================================================================
#  Kissan-AI — docker-compose (app only; connects to a managed Postgres e.g. Neon)
#
#  Usage:
#     cp .env.example .env      # edit the secrets (DB_URL/DB_USER/DB_PASSWORD)
#     docker compose up -d --build
#     curl http://localhost:8080/health
#     docker compose logs -f app
# =============================================================================
services:
  app:
    build: .
    container_name: kissan-ai-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:                   # real secrets live in .env, which is gitignored
      - .env
    environment:
      JAVA_OPTS: "${JAVA_OPTS:-}"
      JAVA_OPTS_EXTRA: "${JAVA_OPTS_EXTRA:-}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
