# =============================================================================
#  Kissan-AI — docker-compose (app + PostgreSQL for production)
#  Starts the API on http://localhost:8080 with a managed PostgreSQL 16.
#
#  Usage:
#     # 1. Create a .env file with secrets (see .env.example)
#     cp .env.example .env          # <-- edit the secrets before next step
#     # 2. Build & run
#     docker compose up -d --build
#     # 3. Verify
#     curl http://localhost:8080/health
#     # 4. Tail logs
#     docker compose logs -f app
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    container_name: kissan-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-kissan_ai}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: kissan-ai-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # --- Database (PostgreSQL) ---
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-kissan_ai}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # --- WhatsApp (real platform) ---
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-dev-verify-token}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      # --- OpenAI (optional, for future LLM-backed AIService) ---
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
