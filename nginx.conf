# =============================================================================
#  Kissan-AI — nginx reverse proxy with TLS termination (Let's Encrypt)
#  /health and /webhook are exposed; /api/* and the frontend are proxied.
#  Install: /etc/nginx/sites-available/kissan-ai.conf -> sites-enabled/
#  Test:    sudo nginx -t && sudo systemctl reload nginx
#  TLS:     sudo certbot --nginx -d api.your-domain.com
# =============================================================================
upstream kissan_ai_backend {
    server 127.0.0.1:8080;   # Kissan-AI app (systemd or Docker host port)
    keepalive 32;
}

server {
    listen 80;
    server_name api.your-domain.com;   # <-- set your domain
    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.your-domain.com;

    # --- TLS (use your certbot/lego certificates) ---
    ssl_certificate     /etc/letsencrypt/live/api.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Timeouts for media uploads (voice/image) from WhatsApp
    client_max_body_size 20M;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;

    # Health check (used by load balancers / uptime monitors)
    location = /health {
        proxy_pass http://kissan_ai_backend;
        access_log off;
    }

    # WhatsApp webhook — forwarded as-is (GET verify + POST receive)
    location /webhook {
        proxy_pass http://kissan_ai_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other API endpoints + static frontend
    location / {
        proxy_pass http://kissan_ai_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
