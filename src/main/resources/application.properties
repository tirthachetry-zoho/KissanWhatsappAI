# Quarkus Configuration
quarkus.application.name=kissan-ai
# Render (and most PaaS) inject $PORT at runtime — honour it, default to 8080 locally.
quarkus.http.port=${PORT:8080}
quarkus.http.cors=true
# Allow the hosts the test console is actually served from (ngrok tunnel + local dev servers)
quarkus.http.cors.origins=https://chariot-shine-landmine.ngrok-free.dev,http://localhost:3000,http://localhost:8000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=content-type,ngrok-skip-browser-warning,authorization,x-requested-with

# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/kissan_ai}
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.sql-load-script=no-file

# Local dev profile: in-memory H2 database (no PostgreSQL needed)
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:kissan;DB_CLOSE_DELAY=-1
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=
%dev.quarkus.hibernate-orm.database.generation=drop-and-create

# Test profile: in-memory H2 database
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:kissan;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# OpenAI Configuration
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4}

# WhatsApp Configuration
whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com/v18.0}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:dev-verify-token}

# Application Configuration
app.supported-languages=en,kn,hi
app.default-language=en

# Default state for new farmer profiles (MP-focused launch)
app.default-state=Madhya Pradesh

# OpenWA Configuration (self-hosted WhatsApp gateway)
# In Docker, this will be overridden by OPENWA_API_BASE_URL=http://openwa:3000
openwa.api-base-url=${OPENWA_API_BASE_URL:http://localhost:2785}
openwa.api-key=${OPENWA_API_KEY:}
openwa.session-name=${OPENWA_SESSION_NAME:kissan-assistant}
openwa.session-id=${OPENWA_SESSION_ID:}
openwa.webhook-url=${OPENWA_WEBHOOK_URL:}
openwa.auto-register-webhook=${OPENWA_AUTO_REGISTER_WEBHOOK:false}
openwa.webhook-secret=${OPENWA_WEBHOOK_SECRET:}
openwa.send-replies=${OPENWA_SEND_REPLIES:false}

# OpenWA REST Client URL
quarkus.rest-client.openwa.url=${OPENWA_API_BASE_URL:http://localhost:2785}

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.kishan".level=DEBUG
# Logging is configured for structured output in environments that support JSON
# (e.g. Render, Kubernetes). No extra extension is required: Quarkus switches to JSON
# logging when quarkus.log.console.json=true. Keep it disabled in dev for readability.
%prod.quarkus.log.console.json=true
%prod.quarkus.log.console.json.pretty-print=false
%prod.quarkus.log.console.json.shared-flux=false
%prod.quarkus.log.console.json.additional-field."service"="kissan-ai"
%prod.quarkus.log.console.json.additional-field."version"="1.0.0-SNAPSHOT"
%dev.quarkus.log.console.json=false

# Logging pattern with traceId from MDC
%dev.quarkus.log.console.format=%d{HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %X{traceId} %s%e%n
%prod.quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %X{traceId} %s%e%n

# Micrometer metrics
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jpa.enabled=true
quarkus.micrometer.binder.system.enabled=true

# OpenTelemetry tracing
quarkus.application.name=kissan-ai
quarkus.opentelemetry.enabled=true
quarkus.opentelemetry.tracer.exporter.otlp.endpoint=http://localhost:4317
%prod.quarkus.opentelemetry.tracer.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.opentelemetry.tracer.sampler=on
quarkus.opentelemetry.tracer.sampler.ratio=1.0

# Request observability: auto-time every HTTP endpoint and log slow/failed requests.
quarkus.endpoint-events.log.timing=true
quarkus.endpoint-events.log.category=com.kishan.observability
quarkus.endpoint-events.log.exclude-paths=/health,/q/health,/q/health,/*/docs,/*/swagger-ui/*
# Health
quarkus.health.extensions.enabled=true
quarkus.health.liveness.enabled=true
quarkus.health.readiness.enabled=true
quarkus.health.readiness.management.enabled=false
quarkus.health.ready-on-init=false

quarkus.http.cors.origins=https://chariot-shine-landmine.ngrok-free.dev,http://localhost:3000,http://localhost:8000

# OpenAPI contract (SmallRye OpenAPI + Swagger UI)
# Serves spec at /q/openapi (yaml/json) and UI at /q/swagger-ui
quarkus.smallrye-openapi.info-title=Kissan-AI API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=WhatsApp AI Assistant for Farmers — farmers, farms, crops, conversations, messages, farm events and WhatsApp webhooks.
quarkus.smallrye-openapi.info-contact-name=Kissan-AI Support
quarkus.smallrye-openapi.info-license-name=MIT
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/docs

# Static test console must always revalidate (no 24h immutable caching)
quarkus.http.filter.test-console.matches=/test.html
quarkus.http.filter.test-console.header.Cache-Control=no-cache, no-store, must-revalidate
