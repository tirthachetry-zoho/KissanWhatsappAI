# Quarkus Configuration
quarkus.application.name=kissan-ai
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:8000

# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/kissan_ai}
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.sql-load-script=no-file

# Local dev profile: in-memory H2 database (no PostgreSQL needed)
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:kissan;DB_CLOSE_DELAY=-1
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=
%dev.quarkus.hibernate-orm.database.generation=drop-and-create

# Test profile: in-memory H2 database
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:kissan;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# OpenAI Configuration
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4}

# WhatsApp Configuration
whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com/v18.0}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:dev-verify-token}

# Application Configuration
app.supported-languages=en,kn,hi
app.default-language=en

# Default state for new farmer profiles (MP-focused launch)
app.default-state=Madhya Pradesh

# OpenWA Configuration (self-hosted WhatsApp gateway)
openwa.api-base-url=${OPENWA_API_BASE_URL:http://localhost:2785}
openwa.api-key=${OPENWA_API_KEY:}
openwa.session-name=${OPENWA_SESSION_NAME:kissan-assistant}
openwa.session-id=${OPENWA_SESSION_ID:}
openwa.webhook-url=${OPENWA_WEBHOOK_URL:}
openwa.auto-register-webhook=${OPENWA_AUTO_REGISTER_WEBHOOK:false}
openwa.webhook-secret=${OPENWA_WEBHOOK_SECRET:}
openwa.send-replies=${OPENWA_SEND_REPLIES:false}

# OpenWA REST Client URL
quarkus.rest-client.openwa.url=${OPENWA_API_BASE_URL:http://localhost:2785}

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.kishan".level=DEBUG
